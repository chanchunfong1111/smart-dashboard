name: Secure Calendar Sync & Encryption

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Fetch and Encrypt Calendar Feeds
        env:
          PERSONAL_ICS_URL: ${{ secrets.PERSONAL_ICS_URL }}
          FAMILY_ICS_URL: ${{ secrets.FAMILY_ICS_URL }}
          CALENDAR_SECRET_KEY: ${{ secrets.CALENDAR_SECRET_KEY }}
        run: |
          python scripts/sync_and_encrypt.py

      - name: Commit and push encrypted calendar bundle
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar_data.enc
          if git diff --staged --quiet; then
            echo "No calendar changes detected."
          else
            git commit -m "Auto-sync: update encrypted calendar_data.enc"
            git push
          fi
