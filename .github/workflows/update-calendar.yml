name: Sync Google Calendar

on:
  schedule:
    # Runs every 4 hours automatically
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest iCal feed
        run: |
          curl -s -f "https://calendar.google.com/calendar/ical/chanchunfong1111%40gmail.com/private-36d37c7a5561aa57a1e4b81d2b2d24d1/basic.ics" -o calendar.ics

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          if git diff --staged --quiet; then
            echo "No changes to calendar"
          else
            git commit -m "Auto-sync: update calendar.ics from Google Calendar"
            git push
          fi
